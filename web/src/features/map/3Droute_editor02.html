<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D Route Editor</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:sans-serif}
#ui{position:absolute;left:10px;top:10px;z-index:100;color:#fff;background:rgba(0,0,0,.65);padding:10px;border-radius:8px;display:flex;flex-direction:column;gap:8px;font-size:13px}
.row{display:flex;gap:6px}
button{background:#2a2a2a;color:#ddd;border:1px solid #444;border-radius:5px;padding:6px 10px;cursor:pointer;font-size:12px}
button:hover{background:#3a3a3a}
button.active{background:#3b7ddd;color:#fff;border-color:#3b7ddd}
#status{font-size:12px;color:#9f9;min-height:16px}
#loading{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#fff;font-size:20px;z-index:200}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js"}}
</script>
</head>
<body>
<div id="loading">Loading GLB...</div>
<div id="ui">
  <div class="row">
    <button id="tEraser" title="消しゴム">🧹 消去</button>
    <button id="tNode" title="ノード">⚪ ノード</button>
    <button id="tLink" title="リンク">🔗 リンク</button>
  </div>
  <div class="row">
    <button id="tView">表示:3D実体</button>
    <button id="tSave">💾 保存</button>
  </div>
  <div id="status"></div>
</div>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/controls/OrbitControls.js";
import { TransformControls } from "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/controls/TransformControls.js";
import { GLTFLoader } from "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/loaders/GLTFLoader.js";

const $ = id => document.getElementById(id);
const statusEl = $("status");
const setStatus = s => statusEl.textContent = s;

// ---------- Three.js 基本セットアップ ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x222222);
const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 10000);
camera.position.set(50, 50, 50);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);

// ---------- ホイールズームの鈍化対策 ----------
// OrbitControls標準のズームは「現在距離に対する倍率」で動くため、
// 近づくほど1回の移動量が指数的に小さくなり極端に鈍くなる。
// 最小移動量(MIN_STEP)を保証した自前のズーム(カーソル位置基準)に置き換える。
controls.enableZoom = false;
const ZOOM_FACTOR = 0.18; // 距離に対する割合
const MIN_STEP = 0.08;    // 最低でもこれだけは動く(世界座標単位)
const zoomRay = new THREE.Raycaster();
const zoomMouse = new THREE.Vector2();
renderer.domElement.addEventListener("wheel", e => {
  e.preventDefault();
  zoomMouse.x = (e.clientX/innerWidth)*2-1;
  zoomMouse.y = -(e.clientY/innerHeight)*2+1;
  zoomRay.setFromCamera(zoomMouse, camera);

  const hitTargets = [];
  if(terrain) hitTargets.push(terrain);
  hitTargets.push(nodesGroup);
  const hits = zoomRay.intersectObjects(hitTargets, true);

  let point;
  if(hits.length){
    point = hits[0].point;
  } else {
    const dist = camera.position.distanceTo(controls.target);
    point = zoomRay.ray.origin.clone().addScaledVector(zoomRay.ray.direction, dist);
  }

  const dir = point.clone().sub(camera.position);
  const dist = dir.length();
  dir.normalize();

  const sign = e.deltaY < 0 ? 1 : -1; // ホイール上=ズームイン
  const step = Math.max(dist * ZOOM_FACTOR, MIN_STEP) * sign;

  camera.position.addScaledVector(dir, step);
  controls.target.addScaledVector(dir, step);
}, {passive:false});
scene.add(new THREE.AmbientLight(0xffffff,2));
const dLight = new THREE.DirectionalLight(0xffffff,2);
dLight.position.set(100,200,100);
scene.add(dLight);

// ---------- 地形(terrain) ----------
let terrain = null;
new GLTFLoader().load("gakkou04.glb", gltf => {
  terrain = gltf.scene;
  scene.add(terrain);
  const box = new THREE.Box3().setFromObject(terrain);
  const center = box.getCenter(new THREE.Vector3());
  terrain.position.sub(center);
  $("loading").remove();
}, undefined, err => { $("loading").textContent = "GLB Load Error"; console.error(err); });

// ---------- ノード/リンク管理 ----------
const nodesGroup = new THREE.Group(); scene.add(nodesGroup);
const linksGroup = new THREE.Group(); scene.add(linksGroup);
let nodeSeq = 0, linkSeq = 0;
const nodes = new Map(); // id -> {mesh, links:Set(linkId)}
const links = new Map(); // id -> {mesh, a:id, b:id}

const NODE_MAT = new THREE.MeshBasicMaterial({color:0x00ff88});
const NODE_MAT_SEL = new THREE.MeshBasicMaterial({color:0xffcc00});
const LINK_MAT = new THREE.MeshBasicMaterial({color:0x3b7ddd});
const REAL_RADIUS = 0.5;      // 3Dモード時のノード実寸半径
const REAL_LINK_R = 0.15;     // 3Dモード時のリンク実寸半径
const SCREEN_K = 0.012;       // 2Dモード時の見かけサイズ係数(距離比例)

function addNode(pos, forceId=null){
  const id = forceId || ("n"+(++nodeSeq));
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(1,16,16), NODE_MAT.clone());
  mesh.position.copy(pos);
  mesh.userData = {type:"node", id};
  nodesGroup.add(mesh);
  nodes.set(id, {mesh, links:new Set()});
  return id;
}

function addLink(aId, bId, forceId=null){
  if(aId===bId) return;
  if(!forceId){
    for(const l of links.values()) if((l.a===aId&&l.b===bId)||(l.a===bId&&l.b===aId)) return; // 重複防止
  }
  const id = forceId || ("l"+(++linkSeq));
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(1,1,1,8), LINK_MAT.clone());
  mesh.userData = {type:"link", id};
  linksGroup.add(mesh);
  links.set(id, {mesh, a:aId, b:bId});
  nodes.get(aId).links.add(id);
  nodes.get(bId).links.add(id);
  updateLinkMesh(id);
  return id;
}

function updateLinkMesh(id){
  const l = links.get(id);
  const pa = nodes.get(l.a).mesh.position, pb = nodes.get(l.b).mesh.position;
  const mid = pa.clone().add(pb).multiplyScalar(0.5);
  const dir = pb.clone().sub(pa);
  const len = dir.length();
  l.mesh.position.copy(mid);
  l.mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir.clone().normalize());
  l.mesh.userData.len = len; // scale.yはvisual更新時に距離基準で設定
}

function removeNode(id){
  const n = nodes.get(id); if(!n) return;
  [...n.links].forEach(removeLink);
  nodesGroup.remove(n.mesh);
  nodes.delete(id);
}
function removeLink(id){
  const l = links.get(id); if(!l) return;
  linksGroup.remove(l.mesh);
  nodes.get(l.a)?.links.delete(id);
  nodes.get(l.b)?.links.delete(id);
  links.delete(id);
}

// ---------- 見た目の更新(2D規定サイズ / 3D実体) ----------
let viewMode = "3d"; // "2d" | "3d"
function updateVisuals(){
  const camPos = camera.position;
  for(const {mesh} of nodes.values()){
    if(viewMode==="2d"){
      const d = mesh.position.distanceTo(camPos);
      mesh.scale.setScalar(Math.max(d*SCREEN_K, 0.05));
    } else {
      mesh.scale.setScalar(REAL_RADIUS);
    }
  }
  for(const l of links.values()){
    const len = l.mesh.userData.len || 1;
    const mid = l.mesh.position;
    if(viewMode==="2d"){
      const d = mid.distanceTo(camPos);
      const r = Math.max(d*SCREEN_K*0.4, 0.02);
      l.mesh.scale.set(r, len, r);
    } else {
      l.mesh.scale.set(REAL_LINK_R, len, REAL_LINK_R);
    }
  }
}

// ---------- Undo(Ctrl+Z) ----------
const historyStack = [];
function serializeState(){
  return {
    nodeSeq, linkSeq,
    nodes:[...nodes.entries()].map(([id,n])=>({id,x:n.mesh.position.x,y:n.mesh.position.y,z:n.mesh.position.z})),
    links:[...links.values()].map(l=>({id:l.mesh.userData.id, a:l.a, b:l.b}))
  };
}
function pushHistory(){
  historyStack.push(serializeState());
  if(historyStack.length>50) historyStack.shift();
}
function restoreState(state){
  selectNode(null);
  nodesGroup.clear(); linksGroup.clear();
  nodes.clear(); links.clear();
  nodeSeq = state.nodeSeq; linkSeq = state.linkSeq;
  state.nodes.forEach(nd => addNode(new THREE.Vector3(nd.x,nd.y,nd.z), nd.id));
  state.links.forEach(ld => addLink(ld.a, ld.b, ld.id));
}
function undo(){
  if(!historyStack.length){ setStatus("これ以上戻せません"); return; }
  restoreState(historyStack.pop());
  setStatus("元に戻しました (Ctrl+Z)");
}
window.addEventListener("keydown", e => {
  if(e.ctrlKey && (e.key==="z"||e.key==="Z")){ e.preventDefault(); undo(); }
});

// ---------- ツール/モード ----------
let tool = null; // null(選択/移動) | "eraser" | "node" | "link"
let pendingLinkNode = null;
let selectedNode = null;

const tEraser=$("tEraser"), tNode=$("tNode"), tLink=$("tLink"), tView=$("tView"), tSave=$("tSave");
function setTool(t){
  tool = (tool===t) ? null : t;
  pendingLinkNode = null;
  [tEraser,tNode,tLink].forEach(b=>b.classList.remove("active"));
  if(tool==="eraser") tEraser.classList.add("active");
  if(tool==="node") tNode.classList.add("active");
  if(tool==="link") tLink.classList.add("active");
  setStatus(tool ? `ツール: ${tool}` : "選択/移動モード");
  if(tool){ selectNode(null); }
}
tEraser.onclick=()=>setTool("eraser");
tNode.onclick=()=>setTool("node");
tLink.onclick=()=>setTool("link");
tView.onclick=()=>{
  viewMode = viewMode==="3d" ? "2d" : "3d";
  tView.textContent = viewMode==="3d" ? "表示:3D実体" : "表示:2D規定";
};
tSave.onclick=async()=>{
  const data = {
    nodes:[...nodes.entries()].map(([id,n])=>({id,x:n.mesh.position.x,y:n.mesh.position.y,z:n.mesh.position.z})),
    links:[...links.values()].map(l=>({id:l.mesh.userData.id, a:l.a, b:l.b}))
  };
  try{
    const res = await fetch("https://192.168.137.1:3333/routes/route_editor3D", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(data)});
    setStatus(res.ok ? "保存しました" : `保存失敗: ${res.status}`);
  }catch(e){ setStatus("保存失敗: APIサーバ未接続"); }
};

// ---------- サーバからの読み込み(html読み込み時) ----------
async function loadFromServer(){
  try{
    const res = await fetch("https://192.168.137.1:3333/routes/route_editor3D");
    if(!res.ok) throw new Error(res.status);
    const data = await res.json();

    (data.nodes||[]).forEach(n=>{
      addNode(new THREE.Vector3(Number(n.x),Number(n.y),Number(n.z)), n.id);
      const num = parseInt(String(n.id).replace(/\D/g,""),10);
      if(!isNaN(num) && num>nodeSeq) nodeSeq = num;
    });
    (data.links||[]).forEach(l=>{
      addLink(l.a, l.b, l.id);
      const num = parseInt(String(l.id).replace(/\D/g,""),10);
      if(!isNaN(num) && num>linkSeq) linkSeq = num;
    });

    setStatus(`読み込み完了: ノード${(data.nodes||[]).length}件 / リンク${(data.links||[]).length}件`);
  }catch(e){
    setStatus("読み込み失敗: APIサーバ未接続");
  }
}
loadFromServer();

// ---------- TransformControls(微調整用ギズモ) ----------
const xform = new TransformControls(camera, renderer.domElement);
xform.setMode("translate");
scene.add(xform);
xform.addEventListener("dragging-changed", e => controls.enabled = !e.value);
xform.addEventListener("mouseDown", () => pushHistory());
xform.addEventListener("objectChange", () => {
  if(!selectedNode) return;
  const n = nodes.get(selectedNode);
  n.links.forEach(updateLinkMesh);
});

function selectNode(id){
  if(selectedNode){
    nodes.get(selectedNode).mesh.material = NODE_MAT.clone();
  }
  selectedNode = id;
  if(id){
    nodes.get(id).mesh.material = NODE_MAT_SEL.clone();
    xform.attach(nodes.get(id).mesh);
  } else {
    xform.detach();
  }
}

// ---------- クリック操作 ----------
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

renderer.domElement.addEventListener("pointerdown", e => {
  if(xform.dragging) return;
  mouse.x = (e.clientX/innerWidth)*2-1;
  mouse.y = -(e.clientY/innerHeight)*2+1;
  raycaster.setFromCamera(mouse, camera);

  const nodeHits = raycaster.intersectObjects(nodesGroup.children);
  const linkHits = raycaster.intersectObjects(linksGroup.children);

  if(tool==="eraser"){
    if(nodeHits.length){ pushHistory(); removeNode(nodeHits[0].object.userData.id); selectNode(null); setStatus("ノードを削除"); }
    else if(linkHits.length){ pushHistory(); removeLink(linkHits[0].object.userData.id); setStatus("リンクを削除"); }
    return;
  }

  if(tool==="link"){
    if(!nodeHits.length){ pendingLinkNode=null; return; }
    const id = nodeHits[0].object.userData.id;
    if(!pendingLinkNode){ pendingLinkNode=id; setStatus("リンク元選択中: 次のノードをクリック"); }
    else { pushHistory(); addLink(pendingLinkNode, id); setStatus("リンクを作成しました"); pendingLinkNode=null; }
    return;
  }

  if(tool==="node"){
    if(nodeHits.length) return; // 既存ノード上では新規作成しない
    if(!terrain) return;
    const hits = raycaster.intersectObject(terrain, true);
    if(hits.length){ pushHistory(); addNode(hits[0].point); setStatus("ノードを設置しました"); }
    return;
  }

  // 選択/移動モード(ツール未選択時)
  if(nodeHits.length){ selectNode(nodeHits[0].object.userData.id); setStatus("ノードを選択(ドラッグで微調整)"); }
  else { selectNode(null); }
});

// DELキーで削除
window.addEventListener("keydown", e => {
  if(e.key==="Delete" && selectedNode){
    pushHistory();
    removeNode(selectedNode);
    selectNode(null);
    setStatus("ノードを削除(DEL)");
  }
});

// ---------- リサイズ/アニメーション ----------
window.addEventListener("resize", () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

function animate(){
  requestAnimationFrame(animate);
  controls.update();
  updateVisuals();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
